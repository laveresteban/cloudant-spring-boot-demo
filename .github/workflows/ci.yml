name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The wrapper pins Maven, so the build does not depend on the runner's Maven.
      # The Testcontainers integration test needs Docker, which ubuntu-latest provides.
      - name: Build and test
        run: ./mvnw -B verify
